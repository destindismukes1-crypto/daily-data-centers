name: Rename to index
on:
  push:
    branches: [main]
    paths: ['daily-data-centers.html']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move temporary file to index.html
        run: mv daily-data-centers.html index.html
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish daily-data-centers.html as index.html" || echo "Nothing to commit"
          git push
