name: Rename temp file to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename temp file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f daily-data-centers.html ]; then
            mv daily-data-centers.html index.html
          else
            echo "daily-data-centers.html not found"
            exit 1
          fi
          git add index.html daily-data-centers.html
          git commit -m "Rename temp file to index.html" || echo "nothing to commit"
          git push
